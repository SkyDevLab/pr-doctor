<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PR Doctor</title>
    <script>
      // Single Page Apps for GitHub Pages redirection script
      // Preserves path and query parameters for the client-side router
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      // If deployed under /pr-doctor/, first segment is pr-doctor
      const repoName = 'pr-doctor';
      let routePath = '';
      if (pathSegments[0] === repoName) {
        routePath = pathSegments.slice(1).join('/');
      } else {
        routePath = pathSegments.join('/');
      }
      
      const query = window.location.search;
      const hash = window.location.hash;
      const redirectUrl = window.location.origin + '/' + repoName + '/?pr=' + encodeURIComponent(routePath) + (query ? '&' + query.slice(1) : '') + hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to PR Doctor...</p>
  </body>
</html>
